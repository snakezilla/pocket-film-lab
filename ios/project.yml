name: PocketFilmLab
options:
  bundleIdPrefix: so.byahsan
  deploymentTarget:
    iOS: "17.0"
targets:
  PocketFilmLab:
    type: application
    platform: iOS
    sources:
      - PocketFilmLab
      - path: ../dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.byahsan.pocketfilmlab
        DEVELOPMENT_TEAM: 9HF7TSVCH4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Film Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Film Lab saves your developed photos to your library. It never reads or changes your other photos.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -cikernel
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  PocketFilmLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PocketFilmLabTests
    dependencies:
      - target: PocketFilmLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 9HF7TSVCH4
schemes:
  PocketFilmLab:
    build:
      targets:
        PocketFilmLab: all
        PocketFilmLabTests: [test]
    test:
      targets:
        - PocketFilmLabTests
